name: test workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker build
        run: echo docker build -t docker.io/${{vars.DOCKERUSERNAME}}/${{vars.IMAGE_NAME}}:latest

      - name: Docker Login
        run: echo docker login --username=${{vars.DOCKERUSERNAME}} --password=${{secrets.DOCKERPASSWORD}}

      - name: Docker Publish
        run: echo docker push docker.io/${{vars.DOCKERUSERNAME}}${{vars.IMAGE_NAME}}:latest

  deploy:
    concurrency:
      group: production-deployment
      cancel-in-progress: true
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Docker run
        run: |
          echo docker run -d -p 8080:80 docker.io/${{vars.DOCKERUSERNAME}}${{vars.IMAGE_NAME}}:latest
          sleep 600s
