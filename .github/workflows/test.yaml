name: test workflow

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t docker.io/${{vars.DOCKERUSERNAME}}/${{vars.IMAGE_NAME}}:latest .

      - name: Docker Login
        run: docker login --username=${{vars.DOCKERUSERNAME}}--DOCKERPASSWORD=${{secrets.password}}

      - name: Docker Publish
        run: docker push docker.io/${{vars.DOCKERUSERNAME}}${{vars.IMAGE_NAME}}:latest

      - name: Docker run
        run: docker run -d -p 8080:80 docker.io/${{vars.DOCKERUSERNAME}}${{vars.IMAGE_NAME}}:latest
