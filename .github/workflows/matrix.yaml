name: Matrix config

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-20.04, ubuntu-latest]
        image: [hello-world, alpine]

    runs-on: ${{matrix.os}}

    steps:
      - name: Echo Docker details
        run: docker info

      - name: Run images
        run: docker run ${{matrix.image}}
